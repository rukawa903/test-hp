<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3分マージ部屋</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- タイトル画面 -->
  <section id="title-screen" class="screen active">
    <div class="title-box">
      <h1>3分マージ部屋</h1>
      <p class="tagline">同じものを重ねて育てよう</p>
      <button id="start-btn" class="btn primary">はじめる</button>
    </div>
  </section>

  <!-- ゲーム画面 -->
  <section id="game-screen" class="screen">
    <header class="hud">
      <span class="hud-item">最高レベル: <b id="best-level">1</b></span>
      <button id="reset-btn" class="btn small">リセット</button>
    </header>

    <div id="board" class="board"></div>

    <footer class="controls">
      <button id="generate-btn" class="btn primary">🛠 生成（Lv1を出す）</button>
    </footer>
  </section>

  <script src="js/game.js"></script>
</body>
</html>
